[project]
name = "career-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3", "pydantic>=2,<3", "alembic>=1.13,<2", "psycopg[binary]>=3,<4", "pgvector>=0.3,<1", "openai>=3,<4", "httpx>=0.27,<1", "mcp>=1,<2", "tzdata>=2024.1", "python-dotenv>=1,<2", "PyJWT[crypto]>=2.10,<3", "pypdf>=6,<8", "python-docx>=1.2,<2", "reportlab>=4.4,<5", "tiktoken>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "pyright>=1.1", "setuptools>=75"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
career = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt", "assets/fonts/SOURCE.json", "assets/tokenizer/*", "assets/writing_guides/*.json"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["backend", "tests"]
extraPaths = ["backend"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
