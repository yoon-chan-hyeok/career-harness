services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-career-dev}
      POSTGRES_DB: career
    volumes: ["career_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career"]
      interval: 5s
      retries: 10
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://career:${POSTGRES_PASSWORD:-local-career-dev}@db/career
      CAREER_ENV: development
      AUTH_MODE: local
      RUN_MIGRATIONS: "1"
      AUTH_TOKENS: ${AUTH_TOKENS:?Set AUTH_TOKENS token-to-user JSON}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_SHADOW_ENABLED: ${JEV_SHADOW_ENABLED:-0}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  career_data:
