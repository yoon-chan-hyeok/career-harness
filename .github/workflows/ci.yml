name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: career, POSTGRES_PASSWORD: test, POSTGRES_DB: career}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U career" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pyright
      - run: pytest
      - run: pytest tests/test_postgres_integration.py
        env: {TEST_POSTGRES_URL: 'postgresql+psycopg://career:test@localhost/career'}
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
        env: {DATABASE_URL: 'postgresql+psycopg://career:test@localhost/career'}
      - name: Reject private files
        run: python scripts/check_privacy.py
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22', package-manager-cache: false}
      - run: npm ci
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint && npm run typecheck && npm run test:auth && npm run test:deploy && npm run test:upgrades && npm run build
