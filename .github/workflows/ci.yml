name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: career, POSTGRES_PASSWORD: test, POSTGRES_DB: career}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U career" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pyright
      - run: pytest
      - run: pytest tests/test_postgres_integration.py
        env: {TEST_POSTGRES_URL: 'postgresql+psycopg://career:test@localhost/career'}
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
        env: {DATABASE_URL: 'postgresql+psycopg://career:test@localhost/career'}
      - name: Reject private files
        run: python scripts/check_privacy.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint && npm run typecheck && npm run test:auth && npm run test:deploy && npm run test:upgrades && npm run build
